name: KBOT-CICD

on:
  push:
    branches:
      - develop
    paths-ignore:
      - "README.md"
      - "argocd/**"

concurrency:
  group: kbot-cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  TARGETOS: linux
  TARGETARCH: amd64

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Version
        id: version
        run: echo "version=$(make -s version)" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: make image TARGETOS=$TARGETOS TARGETARCH=$TARGETARCH

      - name: Push image
        run: make push TARGETOS=$TARGETOS TARGETARCH=$TARGETARCH

      - name: Clean
        if: always()
        run: make clean TARGETOS=$TARGETOS TARGETARCH=$TARGETARCH

  cd:
    name: CD
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Update image tag in Helm chart
        env:
          VERSION: ${{ needs.ci.outputs.version }}
        run: |
          yq -i '.image.tag = strenv(VERSION)' helm/values.yaml
          yq -i '.appVersion = strenv(VERSION)' helm/Chart.yaml
          git diff

      - name: Commit and push
        env:
          VERSION: ${{ needs.ci.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/values.yaml helm/Chart.yaml
          git diff --cached --quiet && { echo "Nothing to commit"; exit 0; }
          git commit -m "chore(helm): update image tag to ${VERSION} [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
